<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Professional digital business card for Juan Suarez, D.H.Sc.(c)." />
  <title>Juan Suarez, D.H.Sc.(c)</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      font-family: Arial, Helvetica, sans-serif;
      background:
        radial-gradient(circle at top left, rgba(255,255,255,.18), transparent 35%),
        linear-gradient(135deg, #0f2742 0%, #1d4f7a 55%, #2f6d8a 100%);
      color: #16324a;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 28px 16px;
    }

    .card {
      width: min(100%, 720px);
      background: rgba(255,255,255,.97);
      border-radius: 26px;
      box-shadow: 0 24px 70px rgba(0,0,0,.28);
      overflow: hidden;
      border: 1px solid rgba(255,255,255,.6);
    }

    .hero {
      padding: 38px 28px 28px;
      text-align: center;
      background: linear-gradient(180deg, #f8fbfd 0%, #eef5f8 100%);
      border-bottom: 1px solid #d8e5ec;
    }

    .photo {
      width: 176px;
      height: 176px;
      object-fit: cover;
      object-position: center 28%;
      border-radius: 50%;
      border: 7px solid #ffffff;
      box-shadow: 0 10px 28px rgba(18, 64, 91, .22);
      margin-bottom: 20px;
    }

    h1 {
      font-size: clamp(2rem, 6vw, 3rem);
      line-height: 1.08;
      color: #12334d;
      margin-bottom: 10px;
    }

    .credentials {
      font-size: 1.05rem;
      color: #42657d;
      font-weight: 700;
      margin-bottom: 14px;
    }

    .headline {
      font-size: 1.08rem;
      line-height: 1.6;
      color: #49697f;
      max-width: 560px;
      margin: 0 auto;
    }

    .content {
      padding: 28px;
    }

    .contact-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 14px;
      margin-bottom: 24px;
    }

    .contact-item {
      display: block;
      text-decoration: none;
      color: #183e59;
      background: #f4f8fa;
      border: 1px solid #dbe7ed;
      border-radius: 15px;
      padding: 17px;
      transition: transform .18s ease, box-shadow .18s ease, background .18s ease;
      overflow-wrap: anywhere;
    }

    .contact-item:hover {
      transform: translateY(-2px);
      background: #ffffff;
      box-shadow: 0 10px 22px rgba(29,79,122,.12);
    }

    .label {
      display: block;
      font-size: .76rem;
      text-transform: uppercase;
      letter-spacing: .09em;
      color: #6d8799;
      font-weight: 700;
      margin-bottom: 6px;
    }

    .value {
      font-size: .98rem;
      font-weight: 700;
    }

    .buttons {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 12px;
      margin-top: 8px;
    }

    .button {
      text-decoration: none;
      text-align: center;
      border-radius: 13px;
      padding: 14px 12px;
      font-weight: 700;
      border: 1px solid #1d4f7a;
      color: #ffffff;
      background: #1d4f7a;
      transition: transform .18s ease, opacity .18s ease;
    }

    .button.secondary {
      color: #1d4f7a;
      background: #ffffff;
    }

    .button:hover {
      transform: translateY(-2px);
      opacity: .94;
    }

    .footer {
      text-align: center;
      padding: 18px 28px 24px;
      color: #708797;
      font-size: .82rem;
    }

    @media (max-width: 620px) {
      .contact-grid,
      .buttons {
        grid-template-columns: 1fr;
      }

      .hero {
        padding-top: 30px;
      }

      .photo {
        width: 150px;
        height: 150px;
      }

      .content {
        padding: 22px;
      }
    }
  </style>
</head>
